<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>峡谷先锋 · 动作原稿</title>
<style>
:root{color-scheme:dark;font:16px/1.6 system-ui,sans-serif;background:#151321;color:#eee9fa}*{box-sizing:border-box}body{max-width:1320px;margin:auto;padding:32px}h1{margin-bottom:4px}p{color:#bcb5cf}button,select,input{font:inherit}button,select{background:#302840;color:inherit;border:1px solid #6c587e;padding:7px 15px;border-radius:8px}button{cursor:pointer}button:hover{background:#49355c}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:14px 0}.stage{width:min(100%,640px);aspect-ratio:1;position:relative;background:#302f3c;overflow:hidden;border:1px solid #655477;border-radius:12px}.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.stage .baseline{position:absolute;top:93.7799%;left:0;right:0;border-top:1px solid #a2a085;pointer-events:none}.stage .baseline:after{content:'y = 1176';position:absolute;right:5px;bottom:0;font-size:11px;color:#c9c4a4}.stage:not(.guides) .baseline{display:none}.review{display:grid;grid-template-columns:minmax(260px,640px) 1fr;gap:24px}.info{padding:16px;background:#201b2b;border-radius:12px;align-self:start}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:24px}.card{margin:0;border:1px solid #453650;border-radius:12px;overflow:hidden;background:#211c2b}.card a{display:block;aspect-ratio:1;background:#353442}.card img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.card figcaption{padding:10px 14px;font-size:14px}.note{color:#ddb678}a{color:#d4bbff}code{font-size:.9em}@media(max-width:760px){body{padding:18px}.review{grid-template-columns:1fr}}
</style>
<body><h1>峡谷先锋 · 18 个动作原稿</h1><p>逐张查看，或播放六帧小跑。这里直接显示生成 PNG，原文件没有经过缩放或重新采样。</p>
<div class="review"><div><div id="stage" class="stage guides"><img id="frame" alt="当前动作"><div class="baseline"></div></div><div class="controls"><button id="play">播放小跑</button><button id="prev">上一张</button><button id="next">下一张</button><select id="pick" aria-label="选择动作"></select></div><div class="controls"><label>帧间隔 <input id="speed" type="range" min="80" max="500" value="195"> <span id="ms">195 ms</span></label><label><input id="guides" type="checkbox" checked> 地面参考线</label></div></div>
<aside class="info"><h2 id="label">动作</h2><p id="filename"></p><p class="note">生成原图存在尺寸、面部和像素网格漂移。严格 8px 网格、硬 alpha 与地面基线的检查结果见 QA.json；本预览用于检查原稿，不代表已完成游戏内动画验收。</p><p><a href="HANDOFF.md">交付说明</a> · <a href="QA.json">格式检查</a></p><p><a href="reference/0_design.png">查看定稿</a> · <a href="reference/1_head.png">查看脸部参考</a></p></aside></div><div id="gallery" class="grid"></div>
<script>
const poses=[['a_raise','举钳'],['a_strike','下砸'],['q_wind','横扫起手'],['q_spin','旋转横扫'],['q_end','横扫收势'],['e_rear','直立长啸'],['e_flip','腾空翻身'],['e_charge','背甲冲锋'],['r_crouch','缩身蓄力'],['r_slam','双钳猛击'],['run1','小跑 1'],['run2','小跑 2'],['run3','小跑 3'],['run4','小跑 4'],['run5','小跑 5'],['run6','小跑 6'],['d_fall','失衡倒下'],['d_down','倒地静止']];
let index=0,timer=null;const pick=document.querySelector('#pick'),frame=document.querySelector('#frame'),play=document.querySelector('#play'),speed=document.querySelector('#speed');const url=id=>'riftherald-pose-'+id+'.png';
for(const [i,[id,label]] of poses.entries()){new Image().src=url(id);const option=new Option(label+' · '+id,i);pick.add(option);const figure=document.createElement('figure');figure.className='card';const a=document.createElement('a');a.href=url(id);a.target='_blank';const img=document.createElement('img');img.src=url(id);img.alt=label;img.loading='lazy';a.append(img);const caption=document.createElement('figcaption');caption.textContent=label+' · '+id;figure.append(a,caption);document.querySelector('#gallery').append(figure)}
function show(i){index=(i+poses.length)%poses.length;const [id,label]=poses[index];frame.src=url(id);frame.alt=label;pick.value=index;document.querySelector('#label').textContent=label;document.querySelector('#filename').textContent=url(id)}
function stop(){clearInterval(timer);timer=null;play.textContent='播放小跑'}function start(){stop();if(index<10||index>15)show(10);play.textContent='暂停小跑';timer=setInterval(()=>show(index>=15?10:index+1),Number(speed.value))}
pick.onchange=()=>{stop();show(Number(pick.value))};document.querySelector('#prev').onclick=()=>{stop();show(index-1)};document.querySelector('#next').onclick=()=>{stop();show(index+1)};play.onclick=()=>timer?stop():start();speed.oninput=()=>{document.querySelector('#ms').textContent=speed.value+' ms';if(timer)start()};document.querySelector('#guides').onchange=e=>document.querySelector('#stage').classList.toggle('guides',e.target.checked);show(0);
</script></body></html>
