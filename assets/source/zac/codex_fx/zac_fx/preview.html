<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>扎克 · 黏液特效预览</title><style>body{font:16px system-ui;background:#171e25;color:#e4eee7;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}article{background:#26333b;border:1px solid #50665e;border-radius:8px;padding:16px}canvas{image-rendering:pixelated;max-width:100%;background:repeating-conic-gradient(#1d272d 0% 25%,#27343a 0% 50%) 50%/24px 24px}a{color:#adf08f}small{display:block;color:#b9c8bd;margin:8px 0}p{max-width:1000px}button{padding:8px 16px}</style><h1>扎克 · 15 张黏液特效</h1><p>显示交付版 1 倍像素资产的逐帧动画；示意播放速度为每帧 130 毫秒，实际游戏时序由接入端设置。生成原稿、1 倍切格表和 8 倍图均可查看。本页未叠加角色，实机层级与遮挡尚需验证。</p><button id="pause">暂停</button><main></main><script>const specs=[{"file":"zac_fx_a_hit.png","binding":"view_effects `league_zac_a_hit`（跟随目标，z 2；左右对称）","size":"14 × 14","symmetry":"left-right","frames":3,"cell_1x":[14,14],"loop":false},{"file":"zac_fx_w_burst.png","binding":"view_effects `league_zac_w_burst`（大表，在他身上，不跟随，z -1；左右对称）","size":"64 × 44","symmetry":"left-right","frames":6,"cell_1x":[64,44],"loop":false},{"file":"zac_fx_w_hit.png","binding":"view_effects `league_zac_w_hit`（跟随目标，z 2；左右对称）","size":"12 × 12","symmetry":"left-right","frames":3,"cell_1x":[12,12],"loop":false},{"file":"zac_fx_q_fist.png","binding":"view_projectiles `league_zac_q_fist`（弹道，z 2；上下对称）","size":"30 × 12","symmetry":"top-bottom","frames":4,"cell_1x":[30,12],"loop":true},{"file":"zac_fx_q_hit.png","binding":"view_effects `league_zac_q_hit`（跟随目标，z 2；左右对称）","size":"16 × 18","symmetry":"left-right","frames":4,"cell_1x":[16,18],"loop":false},{"file":"zac_fx_q_held.png","binding":"view_buffs `league_zac_q_held`（跟随，胸口，z 3；左右对称）","size":"12 × 12","symmetry":"left-right","frames":4,"cell_1x":[12,12],"loop":true},{"file":"zac_fx_q_slam.png","binding":"view_effects `league_zac_q_slam`（大表，在他身前的地上，不跟随，z 2；左右对称）","size":"56 × 26","symmetry":"left-right","frames":6,"cell_1x":[56,26],"loop":false},{"file":"zac_fx_slow.png","binding":"view_buffs `league_zac_q_slow` / `r_slow`（tag `slow`，跟随，脚下，z -1；左右对称）","size":"18 × 7","symmetry":"left-right","frames":4,"cell_1x":[18,7],"loop":true},{"file":"zac_fx_e_land.png","binding":"view_effects `league_zac_e_land`（大表，在他落地的地方，不跟随，z -1；左右对称）","size":"66 × 28","symmetry":"left-right","frames":6,"cell_1x":[66,28],"loop":false},{"file":"zac_fx_e_hit.png","binding":"view_effects `league_zac_e_hit`（跟随目标，z 2；左右对称）","size":"14 × 20","symmetry":"left-right","frames":4,"cell_1x":[14,20],"loop":false},{"file":"zac_fx_r_land.png","binding":"view_effects `league_zac_r_land`（大表，在他落地的地方，不跟随，z -1；左右对称）","size":"58 × 24","symmetry":"left-right","frames":5,"cell_1x":[58,24],"loop":false},{"file":"zac_fx_r_hit.png","binding":"view_effects `league_zac_r_hit`（跟随目标，z 2；左右对称）","size":"14 × 18","symmetry":"left-right","frames":3,"cell_1x":[14,18],"loop":false},{"file":"zac_fx_b_fly.png","binding":"view_projectiles `league_zac_b_fly`（弹道，z 2；上下对称）","size":"10 × 6","symmetry":"top-bottom","frames":3,"cell_1x":[10,6],"loop":true},{"file":"zac_fx_b_lie.png","binding":"view_effects `league_zac_b_lie`（在地上，不跟随，z -1；左右对称；每 15 帧放一次）","size":"10 × 7","symmetry":"left-right","frames":3,"cell_1x":[10,7],"loop":true},{"file":"zac_fx_b_pick.png","binding":"view_effects `league_zac_b_pick`（跟随他，z 3；左右对称）","size":"30 × 40","symmetry":"left-right","frames":4,"cell_1x":[30,40],"loop":false}],labels=["普攻命中","W 黏液爆发","W 命中","Q 长臂弹道","Q 抓中","Q 抓握持续","Q 砸地","减速黏液","E 落地","E 击飞","R 落地","R 命中","被动黏液飞行","被动地面黏液","被动吸收回血"];let running=true;const players=[];for(let i=0;i<specs.length;i++){const s=specs[i],a=document.createElement('article');a.innerHTML='<strong>'+labels[i]+'</strong><small>'+s.frames+' 帧 · '+s.cell_1x.join('×')+' · '+s.symmetry+'</small><canvas></canvas><small><a href="'+s.file+'">8 倍图</a> · <a href="pixel_1x/'+s.file+'">1 倍图</a> · <a href="raw/'+s.file+'">原稿</a></small>';document.querySelector('main').append(a);const c=a.querySelector('canvas'),[w,h]=s.cell_1x;c.width=w*8;c.height=h*8;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;const im=new Image();im.src='pixel_1x/'+s.file;players.push({s,im,c,ctx,w,h});}let tick=0;setInterval(()=>{if(!running)return;for(const p of players){if(!p.im.complete)continue;const f=tick%p.s.frames;p.ctx.clearRect(0,0,p.c.width,p.c.height);p.ctx.drawImage(p.im,f*p.w,0,p.w,p.h,0,0,p.c.width,p.c.height)}tick++},130);document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'暂停':'继续'}</script></html>
