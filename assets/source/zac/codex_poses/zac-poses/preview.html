<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>扎克动作姿势一览</title><style>body{background:#20272b;color:#e4ece9;font:16px system-ui;margin:24px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}figure{margin:0;background:#344047;border:1px solid #63716d;border-radius:8px;padding:12px}img{width:100%;height:auto;image-rendering:pixelated;background:#b9c2bd}figcaption{margin-top:8px}p{color:#cbd7d1}a{color:#a9f285}</style><h1>扎克 · 17 个动作姿势</h1><p>image_gen 原稿一览。用于姿势与造型审阅；精确网格、硬 alpha、统一头框和落点尚需处理。点击图片查看原始分辨率。</p><main><figure><a href="zac-pose-a_wind.png"><img src="zac-pose-a_wind.png" alt="普攻起手"></a><figcaption>普攻起手 · a_wind</figcaption><p>抡臂清楚；伸出的腿及头框位置需对照骨架复核。</p></figure><figure><a href="zac-pose-a_punch.png"><img src="zac-pose-a_punch.png" alt="普攻出拳"></a><figcaption>普攻出拳 · a_punch</figcaption><p>前冲、右向出拳可辨；后腿及拳头位置需对齐。</p></figure><figure><a href="zac-pose-q_wind.png"><img src="zac-pose-q_wind.png" alt="Q 起手"></a><figcaption>Q 起手 · q_wind</figcaption><p>近臂上举、伸长可辨；抬臂方向与骨架仍有偏差。</p></figure><figure><a href="zac-pose-q_reach.png"><img src="zac-pose-q_reach.png" alt="Q 抓取"></a><figcaption>Q 抓取 · q_reach</figcaption><p>前伸长臂、大手张开；前臂相对骨架偏低。</p></figure><figure><a href="zac-pose-q_lift.png"><img src="zac-pose-q_lift.png" alt="Q 举起"></a><figcaption>Q 举起 · q_lift</figcaption><p>双臂举起、面部无遮挡；手掌高度未完全沿骨架。</p></figure><figure><a href="zac-pose-q_slam.png"><img src="zac-pose-q_slam.png" alt="Q 砸地"></a><figcaption>Q 砸地 · q_slam</figcaption><p>已重画成双闭拳；需统一基线。</p></figure><figure><a href="zac-pose-e_plant.png"><img src="zac-pose-e_plant.png" alt="E 按地"></a><figcaption>E 按地 · e_plant</figcaption><p>双手撑地可辨；肢体深度、手脚落点需校正。</p></figure><figure><a href="zac-pose-e_pull.png"><img src="zac-pose-e_pull.png" alt="E 后拉"></a><figcaption>E 后拉 · e_pull</figcaption><p>躯干在左、长臂向右下撑地；左腿仍有偏长风险。</p></figure><figure><a href="zac-pose-e_fly.png"><img src="zac-pose-e_fly.png" alt="E 飞行"></a><figcaption>E 飞行 · e_fly</figcaption><p>横向飞行、腿向后；需要逐格确认脚趾和手指区分。</p></figure><figure><a href="zac-pose-e_land.png"><img src="zac-pose-e_land.png" alt="E 落地"></a><figcaption>E 落地 · e_land</figcaption><p>张臂宽蹲可辨；部分手指形状不完全符合三指。</p></figure><figure><a href="zac-pose-r_crouch.png"><img src="zac-pose-r_crouch.png" alt="R 下蹲"></a><figcaption>R 下蹲 · r_crouch</figcaption><p>弯腿、双手下垂；重心还可进一步压低。</p></figure><figure><a href="zac-pose-r_jump.png"><img src="zac-pose-r_jump.png" alt="R 腾空"></a><figcaption>R 腾空 · r_jump</figcaption><p>已重画缩短双腿；保持明显离地，比例仍需按格复核。</p></figure><figure><a href="zac-pose-r_ball.png"><img src="zac-pose-r_ball.png" alt="R 成球"></a><figcaption>R 成球 · r_ball</figcaption><p>双手抱膝、正面脸可辨；轮廓偏椭圆且位置低于骨架。</p></figure><figure><a href="zac-pose-r_splat.png"><img src="zac-pose-r_splat.png" alt="R 压扁"></a><figcaption>R 压扁 · r_splat</figcaption><p>已重画为低宽摊开形态；宽度超过绿框。</p></figure><figure><a href="zac-pose-d_stagger.png"><img src="zac-pose-d_stagger.png" alt="死亡失衡"></a><figcaption>死亡失衡 · d_stagger</figcaption><p>前伸手可辨；躯干仍偏蹲，失衡倾斜不够明显。</p></figure><figure><a href="zac-pose-d_melt.png"><img src="zac-pose-d_melt.png" alt="死亡融化"></a><figcaption>死亡融化 · d_melt</figcaption><p>已重画成半闭眼、塌陷黏液堆；宽度超过绿框。</p></figure><figure><a href="zac-pose-d_puddle.png"><img src="zac-pose-d_puddle.png" alt="死亡成滩"></a><figcaption>死亡成滩 · d_puddle</figcaption><p>已重画为闭眼横线、软倒触须和低平黏液滩；位置偏低，有少量旁侧小块。</p></figure></main></html>
