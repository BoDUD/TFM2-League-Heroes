; The LPL format: phase 1 single round robin BO3, phase 2 the 登峰 (top 6) and 涅槃 (bottom 4) groups play a double
; round robin BO3, 骑士之路 BO5 for the last two playoff seats, the game's 6-team double elimination playoffs;
; 涅槃 3rd and 4th play the promotion series. Starts with the next LPL season whose phase 2 has not begun.
; LPL 赛制：第一阶段单循环 BO3 → 登峰组（前 6）、涅槃组（后 4）组内双循环 BO3 → 骑士之路 BO5 争最后两个季后赛名额 →
; 6 队双败季后赛；涅槃组第三、四名参加升降级赛。从第二阶段还没开打的那一届起。
