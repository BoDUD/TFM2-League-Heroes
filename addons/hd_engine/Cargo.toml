[package]
name = "hd_engine"
version = "0.1.0"
edition = "2021"
publish = false

# The dense-frame (PPU) engine both packs' DLLs link: league.dll (league_main) and tft.dll (tft). Each DLL hands it its
# own table (src/hd.rs there); the first one loaded in the game process hooks the game, the others hand it their tables
# (src/share.rs). A library only: no mod entry of its own (no declare_stable_mod!), so each DLL exports just its own.
[lib]
crate-type = ["rlib"]

[dependencies]
game_places = { path = "../game_places" }
