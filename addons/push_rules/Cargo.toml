[package]
name = "push_rules"
version = "0.1.0"
edition = "2021"
publish = false

# The rules every add-on's push and pull goes by (2026-11-13, the user: 「沙皇的反推 好像推不到人 整体检查一下各个推的
# 逻辑」): the engine cuts every crowd control by the target's toughness, forced moves included, and League's
# displacements ignore tenacity - so the add-ons lengthen their forced moves, knockbacks, grabs and pulls by it. A library,
# not a mod: the add-ons and league_addons (which compiles their sources) link it.
[dependencies]
mod-api-stable = { path = "../vendor/mod-api-stable" }
