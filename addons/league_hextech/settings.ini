# 海克斯大乱斗 —— 设置（用记事本改，改完保存，重开游戏生效）
# 每行「名字 = 数」，# 后面是说明。删掉某一行、写错、超出范围，那一项就用默认值
# （%APPDATA%\TeamSamoyed\TeamfightManager2\data\league_hextech.log 里 SETTINGS 那一行写着实际用的是多少）。
# 更新本模组时这个文件会被新版覆盖：改过的话先备份一份。

# 每个英雄一局选 4 次：第 1 次在开局，后面 3 次到这几级时选（2–12，默认 6、9、12；本游戏最高 12 级）
level_2 = 6
level_3 = 9
level_4 = 12

# 到第几分钟还没选满 4 次的，一次补齐（0–60，默认 10；0 = 不补，等不到那一级就少选）
catch_up_minute = 10

# 每次选择的档位（银 / 金 / 棱彩）各占多少（0–100，默认 35、45、20）。全场 10 个人每次是同一档，前两次不会都是银
silver_weight = 35
gold_weight = 45
prismatic_weight = 20

# 屏幕上画不画开局的对阵面板和每次选择的提示（0 或 1，默认 1）。头像上的小色块和鼠标放上去的说明总是有
show_picks = 1

# 比赛开始时画面中间那块 10 个人开局海克斯的对阵面板（0 或 1，默认 0 = 不画，太占屏幕）。头像旁的小色块和说明照样有
show_opening = 0

# 战场上的触发特效（点燃、闪电、激光、雪球……）怎么画（0–2，默认 2）：
# 0 = 不画；1 = 只用一个个小方块画（万一贴图出问题时用）；2 = 能画贴图时画贴图
battlefield_effects = 2
