[package]
name = "tft"
version = "0.29.0"
edition = "2021"
publish = false

# The tft pack's own DLL (tft.dll): its heroes' rules the data cannot play, and their dense frames - src/hd.rs is the
# pack's table for hd_engine (shared with league.dll; the first of the two loaded hooks the game).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api-stable = { path = "../vendor/mod-api-stable" }
hd_engine = { path = "../hd_engine" }
