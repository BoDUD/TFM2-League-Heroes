[package]
name = "border"
version = "0.1.0"
edition = "2021"
publish = false

# 边境巡团包自己的 DLL（border.dll）：数据做不到的英雄规则（背压的转移、走弦、存光、选目标），加上三个人的高清帧表
# （src/hd.rs，交给和 league.dll、tft.dll、ragnarok.dll 共用的 hd_engine，谁先加载谁挂钩）。
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mod-api-stable = { path = "../vendor/mod-api-stable" }
hd_engine = { path = "../hd_engine" }
