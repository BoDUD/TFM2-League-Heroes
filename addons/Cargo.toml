# The native add-ons of League Heroes: each member builds one Windows DLL (`cargo build --release`),
# installed as its own mod folder next to the main `league` pack; league_addons compiles all of them into one DLL
# (the add-on bundle players subscribe to, league_addons/README.md). The stable mod API is vendored
# once in vendor/mod-api-stable (the game's mod-sdk-stable, ABI level 9). game_places (the game's places found at run
# time) and hd_engine (the dense frames league.dll and tft.dll share) are libraries the DLLs link, no mods themselves.
[workspace]
members = ["league_*", "tft", "game_places", "hd_engine"]
resolver = "2"

[profile.release]
lto = "thin"
strip = "debuginfo"
