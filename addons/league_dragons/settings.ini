# 英雄联盟大小龙 —— 设置（用记事本改，改完保存，重开游戏生效）
# 每行「名字 = 秒数」，# 后面是说明。删掉某一行、写错、超出范围，那一项就用默认值
# （%APPDATA%\TeamSamoyed\TeamfightManager2\data\league_dragons.log 里 SETTINGS 那一行写着实际用的是多少）。
# 更新本模组时这个文件会被新版覆盖：改过的话先备份一份。

# 远古龙之力持续多少秒（10–600，默认 90）：拿下远古巨龙时活着的英雄，伤害点燃敌方英雄、生命低于 20% 处决
elder_buff_seconds = 90

# 纳什男爵之手持续多少秒（10–600，默认 120）：攻击力、法强 +20%，身边己方小兵受到的伤害 -40%、攻击力 +30%
baron_buff_seconds = 120

# 刷新时间不在这里：远古巨龙就是游戏的小龙营地刷的，和元素亚龙共用一个刷新时间。要改刷新时间，在游戏自带的数据库编辑器里
# 找「元素亚龙」（纳什男爵就找「纳什男爵」）那一组的刷新时间和首次刷新时间，单位是 tick，60 tick = 1 秒。
